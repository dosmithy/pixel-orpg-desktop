# The landing page, site/, on GitHub Pages at download.pixel-orpg.online (site/CNAME).
# Pages must be set to deploy from "GitHub Actions" in the repo's settings.
# Two jobs, so a failed deploy can be re-run alone: re-running the upload too would leave two
# `github-pages` artifacts in the run, which deploy-pages refuses.
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
